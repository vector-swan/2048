<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Fruit Picnic</title>
  <meta name="apple-mobile-web-app-title" content="Fruit Picnic">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <div class="title-block">
          <h1>Fruit Picnic</h1>
          <p class="subtitle">a 2048 game</p>
        </div>
        <div class="scores">
          <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-value" id="best">0</div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="newGameBtn">✿ New Game</button>
        <button class="btn btn-icon" id="soundBtn" title="Sound on/off" aria-label="Sound on"></button>
      </div>
    </header>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="grid-bg">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
    </div>

    <p class="hint">Swipe or use arrow keys ↑ ↓ ← →</p>
  </div>

  <!-- Celebration overlay -->
  <div class="celebration" id="celebration">
    <div class="celebration-content">
      <img class="big-emoji basket-art" id="winArt" alt="A picnic basket full of fruit">
      <h2>Sweet victory!</h2>
      <p>You reached 2048!</p>
      <div class="btn-row">
        <button class="btn btn-big" id="keepGoingBtn">Keep Going!</button>
        <button class="btn btn-big btn-secondary" id="celebNewGameBtn">New Game</button>
      </div>
    </div>
    <canvas id="confetti"></canvas>
  </div>

  <!-- Game Over overlay -->
  <div class="gameover" id="gameover">
    <div class="gameover-content">
      <img class="big-emoji basket-art" id="gameoverArt" alt="An empty picnic basket">
      <h2>Game Over</h2>
      <p>No more moves left</p>
      <p class="final-score">Score <span id="finalScore">0</span></p>
      <button class="btn btn-big" id="gameoverNewGameBtn">Try Again!</button>
    </div>
  </div>

  <script src="tiles.js"></script>
  <script src="game.js"></script>
</body>
</html>
