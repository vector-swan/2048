<!DOCTYPE html>
<!--
  Screenshot rig for the art kit. Loads the real game in a phone-sized frame
  and sets up one scene, chosen by the link:
    capture.html?theme=fruit|halloween&scene=game|win|lose|settings
  build.mjs points headless Chrome at each combination.
-->
<html>
<head>
<meta charset="UTF-8">
<style>html, body { margin: 0; overflow: hidden; } iframe { border: 0; width: 375px; height: 812px; display: block; }</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'fruit', scene = q.get('scene') || 'game';
try {
  localStorage.setItem('2048tutorial', 'done');
  localStorage.setItem('2048best', '20512');
  localStorage.setItem('2048theme', theme);
  localStorage.setItem('2048sound', 'on');
} catch (_) {}
const frame = document.createElement('iframe');
frame.src = '../../index.html';
frame.onload = () => setTimeout(setUp, 300);
document.body.appendChild(frame);

// The same mid-game board in every shot
const BOARD = [[0, 0, 128], [0, 1, 64], [0, 2, 16], [0, 3, 4], [1, 0, 32], [1, 1, 8], [1, 2, 4],
  [2, 0, 8], [2, 1, 2], [2, 3, 2], [3, 0, 2]];
const WIN_BOARD = [[0, 0, 2048], [0, 1, 512], [0, 2, 128], [0, 3, 8], [1, 0, 256], [1, 1, 64], [1, 2, 16],
  [2, 0, 32], [2, 1, 4], [2, 3, 2], [3, 0, 2]];

function setUp() {
  const g = frame.contentWindow;
  // headless Chrome screenshots mid-fade otherwise
  const still = g.document.createElement('style');
  still.textContent = '*, *::before, *::after { transition: none !important; }';
  g.document.head.appendChild(still);
  g.eval(`
    lbShowPost = () => {};                 // never touch the real leaderboard
    soundOn = false;
    liveTiles.forEach(t => t.el.remove());
    liveTiles = [];
    ${JSON.stringify(scene === 'win' ? WIN_BOARD : BOARD)}.forEach(([r, c, value]) => {
      const el = makeTileEl(value, r, c);
      tilesEl.appendChild(el);
      liveTiles.push({ id: nextId++, value, r, c, el });
    });
    score = ${scene === 'win' ? 20512 : 1236};
    document.getElementById('score').textContent = score.toLocaleString('en-US').replace(',', ',');
    document.getElementById('best').textContent = '20512';
  `);
  if (scene === 'win') g.eval('showCelebration()');
  if (scene === 'lose') g.eval('showGameOver()');
  if (scene === 'settings') g.eval(`
    document.getElementById('hapticsToggle').hidden = false; showHapticsIcon();
    openSettings();
  `);
  // let fades and confetti settle, then flag that the shot is ready
  setTimeout(() => { document.title = 'ready'; }, scene === 'win' ? 1400 : 700);
}
</script>
</body>
</html>
